<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TLG Payment</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-soft: #1f2937;
        --accent: #4f46e5;
        --accent-soft: #c7d2fe;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --success: #34d399;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #020817, #0f172a 50%, #111827);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .container {
        max-width: 960px;
        width: 100%;
        padding: 32px 20px;
      }

      .card {
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 18px;
        padding: 32px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin-top: 0;
        font-size: clamp(2rem, 5vw, 3rem);
      }

      .subtitle {
        color: var(--muted);
        margin-bottom: 30px;
        line-height: 1.6;
      }

      .pricing {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
        margin-top: 24px;
      }

      .plan {
        border-radius: 16px;
        background: var(--panel-soft);
        padding: 24px;
        border: 1px solid rgba(99, 102, 241, 0.3);
      }

      .plan.featured {
        border-color: rgba(52, 211, 153, 0.8);
        box-shadow: 0 0 0 1px rgba(52, 211, 153, 0.35);
      }

      .plan h2 {
        margin-top: 0;
      }

      .price {
        font-size: 2.2rem;
        font-weight: bold;
        margin: 14px 0;
      }

      .price span {
        font-size: 1rem;
        font-weight: normal;
        color: var(--muted);
      }

      ul {
        list-style: none;
        padding: 0;
        margin: 0 0 24px;
        color: var(--muted);
      }

      li {
        margin-bottom: 8px;
      }

      button {
        width: 100%;
        padding: 14px 18px;
        border: none;
        border-radius: 10px;
        background: var(--accent);
        color: white;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }

      button:hover {
        opacity: 0.96;
        transform: translateY(-1px);
      }

      .status {
        margin-top: 18px;
        min-height: 24px;
        color: var(--accent-soft);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>TLG AI Receptionist</h1>
        <p class="subtitle">
          Simple and secure Stripe payment checkout for your AI receptionist plan.
        </p>

        <div class="pricing">
          <div class="plan">
            <h2>Starter</h2>
            <div class="price">$29 <span>/ month</span></div>
            <ul>
              <li>Basic call routing</li>
              <li>Email summaries</li>
              <li>1 workspace</li>
            </ul>
            <button data-price-id="price_1234567890">Pay Starter</button>
          </div>

          <div class="plan featured">
            <h2>Pro</h2>
            <div class="price">$79 <span>/ month</span></div>
            <ul>
              <li>Advanced automations</li>
              <li>Multi-seat support</li>
              <li>Priority support</li>
            </ul>
            <button data-price-id="price_1234567890">Pay Pro</button>
          </div>
        </div>

        <div class="status" id="status"></div>
      </div>
    </div>

    <script>
      const statusEl = document.getElementById('status');
      const buttons = document.querySelectorAll('button[data-price-id]');

      buttons.forEach((button) => {
        button.addEventListener('click', async () => {
          const planName = button.parentElement.querySelector('h2').textContent;
          statusEl.textContent = `Starting ${planName} checkout...`;

          try {
            const response = await fetch('/create-checkout-session', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                priceId: button.dataset.priceId,
                customerType: planName.toLowerCase()
              })
            });

            const data = await response.json();

            if (!response.ok) {
              throw new Error(data.error || 'Unable to create checkout session');
            }

            window.location.href = data.url;
          } catch (error) {
            statusEl.textContent = error.message;
          }
        });
      });
    </script>
  </body>
</html>
