<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Successful</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #ecfdf5 0%, #f0fdf4 100%);
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
      }
      .card {
        background: white;
        max-width: 500px;
        width: 100%;
        border-radius: 16px;
        padding: 48px 32px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
      .checkmark {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: #10b981;
        margin: 0 auto 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 48px;
      }
      h1 {
        color: #059669;
        margin: 0 0 12px 0;
        font-size: 2rem;
      }
      p {
        color: #6b7280;
        line-height: 1.6;
        margin: 0 0 24px 0;
      }
      .session-info {
        background: #f3f4f6;
        border-radius: 10px;
        padding: 16px;
        margin: 24px 0;
        text-align: left;
        font-family: monospace;
        font-size: 0.9rem;
        color: #4b5563;
      }
      a {
        display: inline-block;
        background: #4f46e5;
        color: white;
        text-decoration: none;
        padding: 12px 28px;
        border-radius: 8px;
        font-weight: 600;
        transition: background 0.3s ease;
      }
      a:hover {
        background: #4338ca;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="checkmark">✓</div>
      <h1>Payment Successful!</h1>
      <p>Your payment has been processed and your plan is now active.</p>
      <div class="session-info" id="session-info">
        <p>Session ID: <span id="session-id">Loading...</span></p>
      </div>
      <p>You'll receive a confirmation email shortly with your account details.</p>
      <a href="/">Return to Home</a>
    </div>

    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const sessionId = urlParams.get('session_id');
      document.getElementById('session-id').textContent = sessionId || 'N/A';

      if (sessionId) {
        fetch(`/session/${sessionId}`)
          .then((res) => res.json())
          .then((data) => {
            if (data.email) {
              document.getElementById('session-info').innerHTML +=
                `<p>Email: ${data.email}</p>`;
            }
          })
          .catch((err) => console.error('Failed to fetch session:', err));
      }
    </script>
  </body>
</html>
