<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Successful</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f8fafc;

        min-height: 100vh;

      .card {

  <body>
    <div class="card">
      <h1>Payment successful</h1>
      <p>Your Stripe checkout completed successfully.</p>
