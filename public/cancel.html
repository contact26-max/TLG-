<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Cancelled</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #fef2f2 0%, #fef5f5 100%);
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
      }
      .card {
        background: white;
        max-width: 500px;
        width: 100%;
        border-radius: 16px;
        padding: 48px 32px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
      .icon {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: #fee2e2;
        margin: 0 auto 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
      }
      h1 {
        color: #dc2626;
        margin: 0 0 12px 0;
        font-size: 2rem;
      }
      p {
        color: #6b7280;
        line-height: 1.6;
        margin: 0 0 24px 0;
      }
      a {
        display: inline-block;
        background: #4f46e5;
        color: white;
        text-decoration: none;
        padding: 12px 28px;
        border-radius: 8px;
        font-weight: 600;
        transition: background 0.3s ease;
        margin-right: 12px;
      }
      a:hover {
        background: #4338ca;
      }
      .secondary {
        background: #e5e7eb;
        color: #374151;
      }
      .secondary:hover {
        background: #d1d5db;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">✕</div>
      <h1>Payment Cancelled</h1>
      <p>Your payment was cancelled before completion.</p>
      <p style="color: #9ca3af; font-size: 0.95rem;">
        No charges were made to your account.
      </p>
      <a href="/">Try Again</a>
      <a href="mailto:support@tlg.ai" class="secondary">Contact Support</a>
    </div>
  </body>
</html>
